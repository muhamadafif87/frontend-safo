<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Tahu isi goreng dengan cabai rawit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e9cf"/><stop offset="1" stop-color="#ecd5a9"/></linearGradient>
    <linearGradient id="fry" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9a844"/><stop offset="1" stop-color="#c4781f"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="52" cy="52" r="48" fill="#efdbb0" opacity=".7"/><circle cx="350" cy="254" r="56" fill="#e9cf9b" opacity=".7"/>
  <ellipse cx="204" cy="162" rx="104" ry="96" fill="#9a7447" opacity=".22"/>
  <circle cx="200" cy="150" r="98" fill="#ffffff" stroke="#e8dcc3" stroke-width="3"/>
  <circle cx="200" cy="150" r="80" fill="#fbf6ec" stroke="#eee2c9" stroke-width="2"/>
  <!-- tahu 1 -->
  <g transform="rotate(-12 148 120)"><rect x="106" y="86" width="84" height="68" rx="16" fill="url(#fry)" stroke="#9c5d14" stroke-width="3"/>
    <g fill="#8d5210" opacity=".7"><circle cx="124" cy="104" r="3"/><circle cx="150" cy="98" r="2.6"/><circle cx="172" cy="112" r="3"/><circle cx="130" cy="132" r="2.6"/><circle cx="160" cy="136" r="3"/></g>
    <path d="M116 100c14-8 36-8 54-2" stroke="#f5cf82" stroke-width="4" stroke-linecap="round" fill="none" opacity=".8"/></g>
  <!-- tahu 2 (dibelah, tampak isian) -->
  <g transform="rotate(10 262 118)"><rect x="220" y="84" width="84" height="68" rx="16" fill="#f4c46b" stroke="#9c5d14" stroke-width="3"/>
    <rect x="230" y="94" width="64" height="48" rx="10" fill="#fff6dc"/>
    <g><circle cx="248" cy="112" r="7" fill="#f28a2c"/><circle cx="270" cy="106" r="6" fill="#f6a24a"/><circle cx="282" cy="122" r="7" fill="#f28a2c"/><circle cx="258" cy="130" r="6" fill="#93c45a"/><circle cx="240" cy="128" r="5" fill="#b9dd7e"/><circle cx="274" cy="134" r="5" fill="#93c45a"/><circle cx="262" cy="118" r="4" fill="#ffffff"/></g></g>
  <!-- tahu 3 -->
  <g transform="rotate(4 190 200)"><rect x="150" y="170" width="80" height="62" rx="15" fill="url(#fry)" stroke="#9c5d14" stroke-width="3"/>
    <g fill="#8d5210" opacity=".7"><circle cx="168" cy="188" r="3"/><circle cx="194" cy="182" r="2.6"/><circle cx="214" cy="198" r="3"/><circle cx="176" cy="216" r="2.6"/><circle cx="204" cy="218" r="3"/></g>
    <path d="M160 184c14-8 34-8 52-2" stroke="#f5cf82" stroke-width="4" stroke-linecap="round" fill="none" opacity=".8"/></g>
  <!-- cabai rawit -->
  <g><path d="M96 190c20 4 40 18 50 36" stroke="#4fa23a" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M96 190l-8-4" stroke="#2f7425" stroke-width="5" stroke-linecap="round"/><path d="M104 168c22 0 44 10 58 26" stroke="#d93a2c" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M104 168l-8-6" stroke="#2f7425" stroke-width="5" stroke-linecap="round"/></g>
  <!-- sambal kecap -->
  <g><circle cx="288" cy="204" r="26" fill="#ffffff" stroke="#e5d9bf" stroke-width="3"/><circle cx="288" cy="204" r="19" fill="#4a2515"/><circle cx="283" cy="199" r="6" fill="#6a3a24" opacity=".8"/><circle cx="296" cy="208" r="3.4" fill="#d93a2c"/><circle cx="282" cy="211" r="3" fill="#e5483a"/></g>
</svg>
