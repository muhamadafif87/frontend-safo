<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Roti cokelat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8ead6"/><stop offset="1" stop-color="#f0d9bd"/></linearGradient>
    <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3a95e"/><stop offset="1" stop-color="#bd7a34"/></linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0bd92"/><stop offset="1" stop-color="#c99d6d"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="340" cy="46" r="50" fill="#f1d8b6" opacity=".7"/><circle cx="48" cy="256" r="52" fill="#efd1a6" opacity=".7"/>
  <rect x="62" y="58" width="276" height="186" rx="26" fill="#9a7447" opacity=".25" transform="translate(5 7)"/>
  <rect x="62" y="58" width="276" height="186" rx="26" fill="url(#board)" stroke="#b58859" stroke-width="3"/>
  <g stroke="#b58859" stroke-width="1.6" opacity=".45" fill="none"><path d="M80 90c60-6 120 4 240-2"/><path d="M80 130c70 6 150-4 240 2"/><path d="M80 200c80-6 150 6 240-2"/></g>
  <!-- roti utuh 1 -->
  <g transform="rotate(-14 150 130)">
    <ellipse cx="150" cy="132" rx="62" ry="36" fill="url(#bun)" stroke="#9b5f22" stroke-width="3"/>
    <path d="M104 124c14-14 40-20 62-16" stroke="#f3c77f" stroke-width="5" stroke-linecap="round" fill="none" opacity=".8"/>
    <path d="M102 134l14-12 14 14 14-14 14 14 14-14 14 14 14-14 12 12" stroke="#4a2616" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M110 148l14-8 14 10 14-10 14 10 14-10 14 10" stroke="#6b3a22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- roti utuh 2 -->
  <g transform="rotate(10 270 118)">
    <ellipse cx="270" cy="118" rx="52" ry="32" fill="url(#bun)" stroke="#9b5f22" stroke-width="3"/>
    <path d="M232 110c12-12 34-16 52-12" stroke="#f3c77f" stroke-width="4.5" stroke-linecap="round" fill="none" opacity=".8"/>
    <path d="M230 120l12-10 12 12 12-12 12 12 12-12 12 12 12-10" stroke="#4a2616" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- roti dibelah -->
  <g>
    <ellipse cx="200" cy="200" rx="54" ry="32" fill="#f2d7a4" stroke="#9b5f22" stroke-width="3"/>
    <ellipse cx="200" cy="200" rx="54" ry="32" fill="none" stroke="#bd7a34" stroke-width="9" opacity=".9"/>
    <ellipse cx="200" cy="202" rx="40" ry="19" fill="#5a301b"/>
    <ellipse cx="192" cy="198" rx="22" ry="8" fill="#7a4428" opacity=".9"/>
    <path d="M168 210c10 6 24 8 36 6" stroke="#3a1c0f" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <!-- cokelat batang -->
  <g transform="rotate(-8 322 206)"><rect x="296" y="190" width="52" height="34" rx="5" fill="#4a2616" stroke="#2f160b" stroke-width="2"/><path d="M313 190v34M331 190v34M296 207h52" stroke="#6b3a22" stroke-width="2"/></g>
  <g fill="#4a2616"><circle cx="90" cy="108" r="2.6"/><circle cx="104" cy="196" r="2.6"/><circle cx="312" cy="150" r="2.6"/><circle cx="84" cy="164" r="2.2"/></g>
